name: Apply FileRed post size diagnostic

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-post-limit-diagnostic-temporary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Improve multipart limit diagnostic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('FileRed/api/fileEndpoint/index.php')
          text = p.read_text()
          old = """function ejecutador()\n{\n    $apikey = $_POST['apikey'] ?? null;"""
          new = """function ejecutador()\n{\n    // Si el multipart supera post_max_size, PHP descarta por completo $_POST y $_FILES.\n    // Detectarlo aqui evita reportar falsamente que faltan apikey/permiso/metodo.\n    $contentLength = (int) ($_SERVER['CONTENT_LENGTH'] ?? 0);\n    if (empty($_POST) && $contentLength > 0) {\n        echo json_encode([\n            'Validacion' => 'Error',\n            'Respuesta' => [\n                'mensaje' => 'La peticion supera el limite post_max_size de PHP (' . ini_get('post_max_size') . '). Tamano recibido: ' . $contentLength . ' bytes'\n            ]\n        ]);\n        return;\n    }\n\n    $apikey = $_POST['apikey'] ?? null;"""
          if text.count(old) != 1:
              raise RuntimeError(f'marker count={text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          php -l FileRed/api/fileEndpoint/index.php

      - name: Commit focused fix
        shell: bash
        run: |
          rm .github/workflows/fix-post-limit-diagnostic-temporary.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FileRed/api/fileEndpoint/index.php .github/workflows/fix-post-limit-diagnostic-temporary.yml
          git diff --cached --check
          git commit -m "fix(upload): report PHP post size overflow"
          git push origin HEAD:main
