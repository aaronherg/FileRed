<body class="panel-page is-booting" data-area="center">
    <div class="panel-aurora" aria-hidden="true"><span></span><span></span><span></span><i></i></div>
    <div class="panel-shell">
        <aside class="panel-sidebar">
            <a class="panel-brand" href="#/inicio" aria-label="FileRed Center">
                <img src="../files/img/isotipo.png" alt="">
                <span><strong><span class="silver-text">File</span><span class="red-text">Red</span></strong><small>ADMINISTRACIÓN</small></span>
            </a>
            <button class="panel-search" type="button" data-palette-open>
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <span>Buscar opción</span>
                <kbd>Ctrl K</kbd>
            </button>
            <div class="nav-skeleton" data-nav-skeleton aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
            <nav class="panel-nav" data-panel-nav aria-label="Menú principal"></nav>
            <div class="panel-user">
                <button class="panel-user-open" type="button" data-panel-user title="Ver mi perfil">
                <span class="panel-avatar" data-user-initials></span>
                <div class="panel-user-copy">
                    <strong data-user-name></strong>
                    <small data-user-detail></small>
                </div>
                </button>
                <div class="panel-user-actions">
                    <button class="fr-icon-btn" type="button" data-change-password aria-label="Cambiar contraseña" title="Cambiar contraseña">
                        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </button>
                    <button class="fr-icon-btn" type="button" data-logout aria-label="Cerrar sesión" title="Cerrar sesión">
                        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                    </button>
                </div>
            </div>
        </aside>
        <div class="panel-scrim" data-nav-scrim></div>

        <div class="panel-main">
            <header class="panel-topbar">
                <button class="fr-icon-btn panel-nav-toggle" type="button" data-nav-toggle aria-label="Abrir menú">
                    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                </button>
                <div class="panel-heading">
                    <p class="panel-crumb" data-panel-crumb></p>
                    <h1 data-panel-title>Cargando</h1>
                    <p class="panel-description" data-panel-description></p>
                </div>
                <div class="panel-tools">
                    <span class="panel-clock" data-panel-clock></span>
                    <select class="language-select" data-language-switcher aria-label="Idioma">
                        <option value="es">ES</option>
                        <option value="en">EN</option>
                    </select>
                    <button class="fr-icon-btn" type="button" data-theme-toggle aria-label="Cambiar tema" title="Cambiar tema">
                        <svg class="theme-icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
                        <svg class="theme-icon-moon" viewBox="0 0 24 24"><path d="M20.2 15.2A8.5 8.5 0 0 1 8.8 3.8 8.5 8.5 0 1 0 20.2 15.2Z"/></svg>
                    </button>
                </div>
            </header>
            <main class="panel-stage" data-panel-stage data-stage></main>
        </div>
    </div>

    <script src="../../services/archivos/ApiKeyService.js?v=20261120-9"></script>
